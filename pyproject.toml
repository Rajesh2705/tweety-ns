[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tweety-ns"
version = "2.4.1.post1"
description = "Patched tweety-ns (X/Twitter) with rnet transport and fixed x-client-transaction-id ondemand.s resolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "mahrtayyab" },
  { name = "Rajesh Ganesan" },
]
keywords = ["twitter", "x", "tweety", "scraper", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "python-magic>=0.4.27",
  "openpyxl>=3.1",
  "dateutils>=0.6.12",
  "2captcha-python>=1.5",
  "anticaptchaofficial>=1.0",
  "capsolver>=1.0",
  "rnet>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/Rajesh2705/tweety-ns"
Repository = "https://github.com/Rajesh2705/tweety-ns"

[tool.setuptools.packages.find]
where = ["."]
include = ["tweety*"]
